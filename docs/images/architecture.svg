<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="JetBrains Mono, DejaVu Sans Mono, Menlo, Consolas, monospace" role="img" aria-labelledby="t d">
<title id="t">How a command becomes ASCII art</title>
<desc id="d">A command typed in the terminal or in the browser goes through the English command parser, then the executor, which calls the generators and applies color, fill and border. The output is ANSI text. In the browser the same Python code runs inside Pyodide and the ANSI output is turned into HTML.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker><marker id="c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker></defs>
