<text x="30" y="36" fill="#fff" font-size="15" font-weight="700">ASCII Art Generator: how a command becomes art</text>
<text x="30" y="55" fill="#94a3b8" font-size="10">One English command in, ANSI text out. The browser version runs the same Python code.</text>
